name: Publicar Godot en Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Descargar herramientas fijadas y verificar hashes
        run: python3 scripts/setup_tools.py
      - name: Importar, probar y exportar Godot
        run: python3 scripts/build_godot.py
      - name: Preparar Godot en la raíz del sitio
        run: python3 scripts/prepare_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar paquete estático
        id: deployment
        uses: actions/deploy-pages@v4
